<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页 | 网络服务系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(-45deg, #0f172a, #1e293b, #3b82f6, #06b6d4);
            background-size: 400% 400%;
            animation: bgMove 12s ease infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
        }
        @keyframes bgMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .glass-card {
            width: 92%;
            max-width: 600px;
            padding: 60px 40px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.25);
        }
        h1 {
            font-size: 36px;
            color: #fff;
            margin-bottom: 14px;
            letter-spacing: 2px;
        }
        .desc {
            color: #cbd5e1;
            font-size: 17px;
            line-height: 1.8;
            margin-bottom: 36px;
        }
        .line {
            width: 100px;
            height: 3px;
            margin: 0 auto 36px;
            background: linear-gradient(90deg,#3b82f6,#06b6d4);
            border-radius: 999px;
        }
        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        a {
            display: inline-block;
            padding: 14px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
        }
        .login-btn {
            background: rgba(59,130,246,0.3);
            color: #fff;
            border: 1px solid rgba(59,130,246,0.5);
        }
        .reg-btn {
            background: rgba(6,182,212,0.3);
            color: #fff;
            border: 1px solid rgba(6,182,212,0.5);
        }
        a:hover {
            transform: translateY(-4px);
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <h1>C++ HTTP 服务首页</h1>
        <div class="line"></div>
        <p class="desc">基于原生TCP实现简易Web服务器<br>支持用户登录、注册功能</p>
        <div class="btn-group">
            <a href="login.html" class="login-btn">前往登录</a>
            <a href="register.html" class="reg-btn">账号注册</a>
        </div>
    </div>
</body>
</html>
