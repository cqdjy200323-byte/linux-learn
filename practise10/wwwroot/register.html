<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账号注册</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(-45deg, #0f172a, #1e293b, #3b82f6, #06b6d4);
            background-size: 400% 400%;
            animation: bgMove 12s ease infinite;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        @keyframes bgMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .reg-box {
            width: 92%;
            max-width: 420px;
            padding: 50px 35px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 24px;
        }
        h2 {
            color: #fff;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .item {
            margin-bottom: 18px;
        }
        label {
            display: block;
            color: #cbd5e1;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            background: rgba(255,255,255,0.12);
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        input::placeholder {
            color: #94a3b8;
        }
        .submit {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border-radius: 10px;
            border: none;
            background: #06b6d4;
            color: white;
            font-size: 17px;
            cursor: pointer;
            transition: 0.3s;
        }
        .submit:hover {
            background: #0891b2;
        }
        .tip {
            text-align: center;
            margin-top: 24px;
            color: #94a3b8;
        }
        .tip a {
            color: #38bdf8;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="reg-box">
        <h2>新用户注册</h2>
        <div class="item">
            <label>设置用户名</label>
            <input type="text" placeholder="4-16位字母数字">
        </div>
        <div class="item">
            <label>设置密码</label>
            <input type="password" placeholder="至少6位密码">
        </div>
        <div class="item">
            <label>确认密码</label>
            <input type="password" placeholder="再次输入密码">
        </div>
        <button class="submit">完成注册</button>
        <div class="tip">
            已有账号？<a href="login.html">去登录</a>
            <br><a href="index.html">返回首页</a>
        </div>
    </div>
</body>
</html>
